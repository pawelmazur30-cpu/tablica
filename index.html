<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#414141">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Tablica rynków</title>
<style>
  :root { --bg: #414141; --line: #555555; --text: #c8c8c8; --on: #ffffff; --accent: #ffffff; --bar-h: 56px; --tape-h: 46px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none; }

  /* górny pasek: wybór wykresu (stuknij albo przesuń palcem) i interwału */
  #bar { flex: 0 0 var(--bar-h); display: flex; align-items: center; justify-content: space-between; gap: 16px;
         padding: 0 12px; border-bottom: 1px solid var(--line); touch-action: pan-y; }
  .group { display: flex; gap: 6px; }
  #bar button { font: 600 17px system-ui, sans-serif; color: var(--text); background: none; border: 1px solid transparent;
                border-radius: 10px; padding: 9px 16px; }
  #bar button.on { color: var(--on); background: #555555; border-color: #666666; }
  #intervals button.on { color: #000000; background: var(--accent); border-color: var(--accent); }

  #viewport { position: relative; flex: 1; overflow: hidden; }
  /* wszystkie wykresy leżą na ekranie jeden na drugim (ukryte też muszą się rysować) */
  .slide { position: absolute; inset: 0; opacity: 0; z-index: 0; pointer-events: none; transition: opacity .3s ease; }
  .slide.on { opacity: 1; z-index: 1; pointer-events: auto; }
  .slide .tradingview-widget-container, .slide .tradingview-widget-container__widget { height: 100%; width: 100%; }
  /* widżet nie pozwala zmienić kolorów świec, więc filtr robi z zielonych (jasność 0,47) białe,
     z czerwonych (0,37) czarne, a tło widżetu #686868 daje szare #414141 */
  .slide iframe { filter: grayscale(1) brightness(1.183) contrast(14); }

  #tape { flex: 0 0 var(--tape-h); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="bar">
  <div class="group" id="tabs"></div>
  <div class="group" id="intervals"></div>
</div>
<div id="viewport"></div>
<div id="tape"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div></div>

<script>
// Wykresy w kolejności przesuwania. Symbole z darmowych widżetów TradingView (ceny na żywo).
const CHARTS = [
  { name: 'Bitcoin',    symbol: 'BITSTAMP:BTCUSD' },
  { name: 'Nasdaq 100', symbol: 'FOREXCOM:NSXUSD' },
  { name: 'EUR/USD',    symbol: 'FX:EURUSD' },
  { name: 'S&P 500',    symbol: 'FOREXCOM:SPXUSD' },
];

const INTERVALS =[['5', '5m'], ['15', '15m'], ['60', '1h'], ['240', '4h'], ['D', '1D']];

const TAPE = [
  ['FOREXCOM:SPXUSD', 'S&P 500'], ['FOREXCOM:NSXUSD', 'Nasdaq 100'], ['BITSTAMP:BTCUSD', 'Bitcoin'],
  ['BITSTAMP:ETHUSD', 'Ethereum'], ['FX:EURUSD', 'EUR/USD'], ['FX_IDC:USDPLN', 'USD/PLN'], ['TVC:GOLD', 'Złoto'],
  ['NASDAQ:NVDA', 'Nvidia'], ['NASDAQ:AAPL', 'Apple'], ['NASDAQ:MSFT', 'Microsoft'], ['NASDAQ:GOOGL', 'Alphabet'],
  ['NASDAQ:AMZN', 'Amazon'], ['NASDAQ:META', 'Meta'], ['NASDAQ:TSLA', 'Tesla'], ['NASDAQ:PLTR', 'Palantir'],
];

function load(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

let current = Math.min(load('slide', 0), CHARTS.length - 1);
const intervals = load('intervals', CHARTS.map(() => '60'));  // interwał zapamiętany osobno dla każdego wykresu

function embed(container, file, config) {
  const s = document.createElement('script');
  s.src = 'https://s3.tradingview.com/external-embedding/' + file;
  s.async = true;
  s.text = JSON.stringify(config);
  container.appendChild(s);
}

const viewport = document.getElementById('viewport');
const tabs = document.getElementById('tabs');
const ivBox = document.getElementById('intervals');

function drawChart(i) {
  const slide = viewport.children[i];
  slide.innerHTML = '<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>';
  embed(slide.firstChild, 'embed-widget-advanced-chart.js', {
    autosize: true, symbol: CHARTS[i].symbol, interval: intervals[i], timezone: 'Europe/Warsaw',
    theme: 'dark', style: '1', locale: 'pl', backgroundColor: '#686868', gridColor: '#6a6a6a',
    hide_top_toolbar: true, hide_side_toolbar: true, hide_volume: true,
    allow_symbol_change: false, save_image: false, calendar: false,
    support_host: 'https://www.tradingview.com',
  });
}

CHARTS.forEach((c, i) => {
  viewport.appendChild(Object.assign(document.createElement('div'), { className: 'slide' }));
  const b = Object.assign(document.createElement('button'), { textContent: c.name });
  b.onclick = () => show(i);
  tabs.appendChild(b);
  // ładowanie po kolei, żeby słaby tablet się nie dławił (bieżący od razu)
  setTimeout(() => drawChart(i), i === current ? 0 : 1500 * (1 + ((i - current + CHARTS.length) % CHARTS.length)));
});

INTERVALS.forEach(([value, label]) => {
  const b = Object.assign(document.createElement('button'), { textContent: label });
  b.dataset.value = value;
  b.onclick = () => {
    if (intervals[current] === value) return;
    intervals[current] = value;
    save('intervals', intervals);
    drawChart(current);
    mark();
  };
  ivBox.appendChild(b);
});

function mark() {
  [...viewport.children].forEach((s, k) => s.classList.toggle('on', k === current));
  [...tabs.children].forEach((b, k) => b.classList.toggle('on', k === current));
  [...ivBox.children].forEach(b => b.classList.toggle('on', b.dataset.value === intervals[current]));
}

function show(i) {
  current = (i + CHARTS.length) % CHARTS.length;  // w kółko
  save('slide', current);
  mark();
}
mark();

embed(document.querySelector('#tape .tradingview-widget-container'), 'embed-widget-ticker-tape.js', {
  symbols: TAPE.map(([proName, title]) => ({ proName, title })),
  showSymbolLogo: true, isTransparent: true, displayMode: 'adaptive', colorTheme: 'dark', locale: 'pl',
});

// przesunięcie palcem po górnym pasku zmienia wykres (po samym wykresie palec przesuwa wykres)
const bar = document.getElementById('bar');
let startX = null;
bar.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
bar.addEventListener('touchend', e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  startX = null;
  if (dx < -60) show(current + 1); else if (dx > 60) show(current - 1);
});
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(current + 1); if (e.key === 'ArrowLeft') show(current - 1); });

// odświeżenie co 4 godziny, żeby strona nie zamulała po całym dniu
setTimeout(() => location.reload(), 4 * 60 * 60 * 1000);
</script>
</body>
</html>
